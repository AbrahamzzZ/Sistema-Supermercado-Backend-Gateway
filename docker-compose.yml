# =====================================================================
#  Sistema Supermercado - Microservicios
#  Uso (desde la carpeta Sistema-Supermercado-Backend-Gateway):
#     docker compose up -d --build
#
#  Los 5 repos deben estar clonados uno al lado del otro:
#     Microservicios Sistema Supermercado/
#       ├─ Sistema-Supermercado-Backend-Admin
#       ├─ Sistema-Supermercado-Backend-Auth
#       ├─ Sistema-Supermercado-Backend-Gateway   <- aquí está este archivo
#       ├─ Sistema-Supermercado-Backend-Inventory
#       └─ Sistema-Supermercado-Backend-Order
#
#  URLs (host):
#     API Gateway (Ocelot) ....... http://localhost:8000
#     Admin Swagger .............. http://localhost:8001/swagger
#     Auth Swagger ............... http://localhost:8002/swagger
#     Inventory Swagger .......... http://localhost:8003/swagger
#     Order Swagger .............. http://localhost:8004/swagger
#     Kafka UI ................... http://localhost:8090
#     SQL Server ................. localhost,14330  (usuario sa)
#     Kafka (desde el host) ...... localhost:29092
# =====================================================================

name: supermercado

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Docker
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: SupermercadoAPI
  Jwt__Audience: SupermercadoClient
  # JWT RS256: Gateway/Admin/Inventory/Order descargan la clave PÚBLICA de Auth (JWKS).
  # Ninguno de ellos tiene la clave privada.
  Jwt__Authority: http://auth-api:8080
  Jwt__RequireHttpsMetadata: "false"   # dentro de la red de Docker se usa http

services:
  # ------------------------------------------------------------------
  # Infraestructura
  # ------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supermercado-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Supermercado_2026!}
      MSSQL_PID: Developer
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: supermercado-kafka
    ports:
      - "29092:29092"
    environment:
      # Modo KRaft (sin Zookeeper), un solo nodo
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # INTERNAL -> lo usan los contenedores (kafka:9092) | EXTERNAL -> lo usas tú desde Windows (localhost:29092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Crea el tópico antes de que arranquen Order (producer) e Inventory (consumer)
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: supermercado-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic movimientos-stock --partitions 3 --replication-factor 1
      && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: supermercado-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supermercado
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Microservicios
  # ------------------------------------------------------------------
  auth-api:
    build:
      context: ../Sistema-Supermercado-Backend-Auth
    container_name: supermercado-auth
    environment:
      <<: *dotnet-env
      ConnectionStrings__CadenaSQL: "Server=sqlserver,1433;Database=DB_Auth;User Id=sa;Password=${SA_PASSWORD:-Supermercado_2026!};TrustServerCertificate=True;"
      # Solo Auth recibe la clave PRIVADA, montada como secret (archivo de solo lectura)
      Jwt__PrivateKeyPath: /run/secrets/jwt_private_key
    secrets:
      - jwt_private_key
    ports:
      - "8002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  admin-api:
    build:
      context: ../Sistema-Supermercado-Backend-Admin
    container_name: supermercado-admin
    environment:
      <<: *dotnet-env
      ConnectionStrings__CadenaSQL: "Server=sqlserver,1433;Database=DB_Admin;User Id=sa;Password=${SA_PASSWORD:-Supermercado_2026!};TrustServerCertificate=True;"
      # Ollama corriendo en tu Windows (fuera de Docker)
      Ollama__BaseUrl: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  inventory-api:
    build:
      context: ../Sistema-Supermercado-Backend-Inventory
    container_name: supermercado-inventory
    environment:
      <<: *dotnet-env
      ConnectionStrings__CadenaSQL: "Server=sqlserver,1433;Database=DB_Inventory;User Id=sa;Password=${SA_PASSWORD:-Supermercado_2026!};TrustServerCertificate=True;"
      Services__GatewayUrl: http://gateway:8080
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: inventory-service
    ports:
      - "8003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  order-api:
    build:
      context: ../Sistema-Supermercado-Backend-Order
    container_name: supermercado-order
    environment:
      <<: *dotnet-env
      ConnectionStrings__CadenaSQL: "Server=sqlserver,1433;Database=DB_Order;User Id=sa;Password=${SA_PASSWORD:-Supermercado_2026!};TrustServerCertificate=True;"
      Services__GatewayUrl: http://gateway:8080
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  gateway:
    build:
      context: .
    container_name: supermercado-gateway
    environment:
      <<: *dotnet-env
    ports:
      - "8000:8080"
    depends_on:
      - auth-api
      - admin-api
      - inventory-api
      - order-api
    restart: on-failure

secrets:
  # Generar una sola vez (ver README de Docker / .env.example):
  #   openssl genrsa -out secrets/jwt_private_key.pem 2048
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem

volumes:
  sqlserver-data:
  kafka-data:
